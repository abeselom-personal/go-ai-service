services:
  ai-service:
    build: .
    ports:
      - "8082:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - ai-database
      - redis
    networks:
      - app-network

  ai-database:
    image: postgres:latest
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

volumes:
  pgdata:
  redis_data:
networks:
  app-network:
